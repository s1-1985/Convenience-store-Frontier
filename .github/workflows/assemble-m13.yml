name: Assemble Milestone 13

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/assemble-m13.yml"
      - ".m13/**"

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/milestone-13-individual-store-loop

      - name: Assemble source files
        run: |
          mkdir -p src/game src/ui src/tests
          for file in .m13/engine.*; do base64 -d "$file"; done > src/game/storeOperationsEngine.ts
          for file in .m13/runtime.*; do base64 -d "$file"; done > src/ui/storeGameRuntime.ts
          for file in .m13/css.*; do base64 -d "$file"; done > src/ui/storeGame.css
          for file in .m13/test.*; do base64 -d "$file"; done > src/tests/storeOperationsEngine.test.ts
          rm -rf .m13
          rm -f .github/workflows/assemble-m13.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add individual store operations loop"
          git push origin HEAD:agent/milestone-13-individual-store-loop
