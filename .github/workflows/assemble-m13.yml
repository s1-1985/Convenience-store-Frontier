name: Assemble Milestone 13

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/milestone-13-individual-store-loop

      - name: Assemble source files
        run: |
          mkdir -p src/game src/ui src/tests
          cat .m13/engine.* | base64 -d > src/game/storeOperationsEngine.ts
          cat .m13/runtime.* | base64 -d > src/ui/storeGameRuntime.ts
          cat .m13/css.* | base64 -d > src/ui/storeGame.css
          cat .m13/test.* | base64 -d > src/tests/storeOperationsEngine.test.ts
          rm -rf .m13
          rm -f .github/workflows/assemble-m13.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add individual store operations loop"
          git push origin HEAD:agent/milestone-13-individual-store-loop
