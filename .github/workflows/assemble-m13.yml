name: Assemble Milestone 13

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/assemble-m13.yml"
      - ".m13/**"

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/milestone-13-individual-store-loop

      - name: Assemble verified source bundle
        run: |
          printf '%s  %s\n' '419e3b81345a118a0f02f05c15a87ae32da1b35093fab838e731d0e802d4a2ff' '.m13/source.00' | sha256sum -c -
          printf '%s  %s\n' '62801a47f0e2baad946a156ad47b16c95ba313f5f26a69aca4e916fbdaa1a4b4' '.m13/source.01' | sha256sum -c -
          printf '%s  %s\n' 'f4d1970dabf0c1a34302db1780bdc43cb4e2a8300ed8fd05e8e347e31f238859' '.m13/source.02' | sha256sum -c -
          printf '%s  %s\n' 'f10a171787fc5ad4fa070e4db34bcdc6acb933e086555cb87f60ba5dd8ddd292' '.m13/source.03a' | sha256sum -c -
          printf '%s  %s\n' '64776e8343d7d2003aaa23f851c617eca0b19db496c94cb957aa9470ce6a7d2a' '.m13/source.03b' | sha256sum -c -
          cat .m13/source.00 .m13/source.01 .m13/source.02 .m13/source.03a .m13/source.03b > /tmp/m13-source.zip.b64
          printf '%s  %s\n' '310bc32ed72ee20f106be7db1a53f6d1bc7c2200c951768e3b5879deea79fb88' '/tmp/m13-source.zip.b64' | sha256sum -c -
          base64 -d /tmp/m13-source.zip.b64 > /tmp/m13-source.zip
          printf '%s  %s\n' '6d3a143028c4cf359ee347ae55c8ae85e3a177e603f2f0a5ef15609b1e34b89b' '/tmp/m13-source.zip' | sha256sum -c -
          unzip -o /tmp/m13-source.zip -d .
          printf '%s  %s\n' '6e8cb4f769f30450c097e2d033e07c2f17bc2f496a1eaf05480d5350a05c9d58' 'src/game/storeOperationsEngine.ts' | sha256sum -c -
          printf '%s  %s\n' '04c14beb999a249c6c2ce72ab5b65a185e00061c49836ca1a55c9e0f1b35429b' 'src/ui/storeGameRuntime.ts' | sha256sum -c -
          printf '%s  %s\n' '04cd1c83f0825fb35681390972eadf1259e754d9ce81b45e75c05bd50c01627c' 'src/ui/storeGame.css' | sha256sum -c -
          printf '%s  %s\n' 'b69e3c9c1f2e7e023b1815827c0fa0655af190321eb4b213028a573c00c17a52' 'src/tests/storeOperationsEngine.test.ts' | sha256sum -c -
          rm -rf .m13
          rm -f .github/workflows/assemble-m13.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add individual store operations loop"
          git push origin HEAD:agent/milestone-13-individual-store-loop
