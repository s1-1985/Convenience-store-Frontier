name: Assemble Milestone 13

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/assemble-m13.yml"
      - ".m13/**"

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/milestone-13-individual-store-loop

      - name: Upload staged chunks for byte verification
        uses: actions/upload-artifact@v4
        with:
          name: milestone-13-staged-chunks
          path: .m13
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: true

      - name: Assemble and verify source files
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import hashlib

          targets = {
              "engine": (Path("src/game/storeOperationsEngine.ts"), "6e8cb4f769f30450c097e2d033e07c2f17bc2f496a1eaf05480d5350a05c9d58"),
              "runtime": (Path("src/ui/storeGameRuntime.ts"), "04c14beb999a249c6c2ce72ab5b65a185e00061c49836ca1a55c9e0f1b35429b"),
              "css": (Path("src/ui/storeGame.css"), "04cd1c83f0825fb35681390972eadf1259e754d9ce81b45e75c05bd50c01627c"),
              "test": (Path("src/tests/storeOperationsEngine.test.ts"), "b69e3c9c1f2e7e023b1815827c0fa0655af190321eb4b213028a573c00c17a52"),
          }

          mismatches = []
          for prefix, (target, expected) in targets.items():
              target.parent.mkdir(parents=True, exist_ok=True)
              output = bytearray()
              for chunk in sorted(Path(".m13").glob(f"{prefix}.*")):
                  raw = "".join(chunk.read_text().split())
                  raw += "=" * ((-len(raw)) % 4)
                  output.extend(base64.b64decode(raw, validate=False))
              digest = hashlib.sha256(output).hexdigest()
              print(prefix, len(output), digest, "expected", expected)
              for chunk in sorted(Path(".m13").glob(f"{prefix}.*")):
                  print("  ", chunk.name, hashlib.sha256(chunk.read_bytes()).hexdigest(), chunk.stat().st_size)
              if digest != expected:
                  mismatches.append(prefix)
              else:
                  target.write_bytes(output)
          if mismatches:
              raise SystemExit("digest mismatch: " + ", ".join(mismatches))
          PY
          rm -rf .m13
          rm -f .github/workflows/assemble-m13.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add individual store operations loop"
          git push origin HEAD:agent/milestone-13-individual-store-loop
