name: Apply balance benchmark once

on:
  push:
    branches:
      - agent/milestone-9-balance-benchmark
    paths:
      - .github/workflows/apply-balance-benchmark-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/milestone-9-balance-benchmark
      - name: Apply benchmark payload
        run: |
          cat > /tmp/csf-payload.b64 <<'PAYLOAD'
          
          PAYLOAD
          base64 -d /tmp/csf-payload.b64 | tar -xzf - -C .
          git config user.name "balance-benchmark-bot"
          git config user.email "balance-benchmark-bot@users.noreply.github.com"
          git add .gitignore package.json src/index.ts src/balance src/tests/balanceBenchmark.test.ts docs/balance-testing.md .github/workflows/ci.yml
          git commit -m "feat: add multi-seed balance benchmark"
          git push origin HEAD:agent/milestone-9-balance-benchmark
