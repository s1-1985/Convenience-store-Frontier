name: Patch campaign source once

on:
  push:
    branches:
      - agent/milestone-8-30-day-campaign
    paths:
      - .github/workflows/patch-campaign-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/milestone-8-30-day-campaign
      - name: Correct campaign scoring and objective unlocks
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/campaign/campaign.ts')
          text = path.read_text()
          text = text.replace(
              'const resilienceBase = clamp((netLiquidity + 100_000) / 600_000, 0, 1) * 20;',
              'const resilienceBase = clamp((netLiquidity + 100_000) / 600_000, 0, 1) * 15;',
          )
          text = text.replace(
              'maxScore: 20,\n      summary: `返済考慮後資金',
              'maxScore: 15,\n      summary: `返済考慮後資金',
          )
          text = text.replace(
              'if (!objective || objective.status === "completed") {',
              'if (!objective || objective.status !== "active") {',
          )
          path.write_text(text)
          PY
      - name: Commit patch
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "campaign-patch-bot"
          git config user.email "campaign-patch-bot@users.noreply.github.com"
          git add src/campaign/campaign.ts
          git commit -m "fix: correct campaign scoring and unlock gates"
          git push origin HEAD:agent/milestone-8-30-day-campaign
