name: Fix playtest nullability once

on:
  push:
    branches:
      - agent/milestone-10-playtest-telemetry
    paths:
      - .github/workflows/fix-playtest-null-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/milestone-10-playtest-telemetry
      - name: Fix nullable session capture
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/ui/playtestRuntime.ts')
          text = path.read_text()
          old = '''function aggregateSessions(): PlaytestSession[] {
            const finishedHistory = history.filter((entry) => entry.finished);
            if (!session?.finished) return finishedHistory;
            return [session, ...finishedHistory.filter((entry) => entry.sessionId !== session.sessionId)];
          }'''
          new = '''function aggregateSessions(): PlaytestSession[] {
            const finishedHistory = history.filter((entry) => entry.finished);
            const currentSession = session;
            if (!currentSession?.finished) return finishedHistory;
            return [
              currentSession,
              ...finishedHistory.filter((entry) => entry.sessionId !== currentSession.sessionId),
            ];
          }'''
          if old not in text:
              raise SystemExit('aggregateSessions block not found')
          path.write_text(text.replace(old, new))
          PY
      - name: Commit fix
        run: |
          git config user.name "playtest-fix-bot"
          git config user.email "playtest-fix-bot@users.noreply.github.com"
          git add src/ui/playtestRuntime.ts
          git commit -m "fix: preserve finished session narrowing"
          git push origin HEAD:agent/milestone-10-playtest-telemetry
