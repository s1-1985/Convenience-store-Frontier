name: Fix Milestone 14 Canvas Context

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/fix-m14-canvas-context.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/milestone-14-store-layout-editor

      - name: Narrow canvas context and commit
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/ui/storeLayoutEditorUi.ts")
          text = path.read_text()
          old = (
              '  const overlayContext = overlay.getContext("2d");\n'
              '  if (!overlayContext) throw new Error("Store layout editor canvas is unavailable");\n'
              '  overlayContext.imageSmoothingEnabled = false;'
          )
          new = (
              '  const contextCandidate = overlay.getContext("2d");\n'
              '  if (!contextCandidate) throw new Error("Store layout editor canvas is unavailable");\n'
              '  const overlayContext: CanvasRenderingContext2D = contextCandidate;\n'
              '  overlayContext.imageSmoothingEnabled = false;'
          )
          if text.count(old) != 1:
              raise SystemExit("canvas context anchor mismatch")
          path.write_text(text.replace(old, new))
          PY
          rm -f .github/workflows/fix-m14-canvas-context.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: retain non-null layout editor canvas context"
          git push origin HEAD:agent/milestone-14-store-layout-editor
