name: Assemble Milestone 16

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/assemble-m16.yml"
      - ".m16/**"
      - ".m16asset/**"
      - ".m16r/**"

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/milestone-16-real-raster-store

      - name: Verify and expand real raster source bundle
        run: |
          cat .m16/source.00 .m16/source.01x > /tmp/m16-source.zip.b64
          base64 -d /tmp/m16-source.zip.b64 > /tmp/m16-source.zip
          unzip -t /tmp/m16-source.zip
          unzip -o /tmp/m16-source.zip -d .

      - name: Verify and expand real raster asset bundle
        run: |
          cat .m16asset/asset.00 .m16r/asset.02_03 > /tmp/m16-assets.zip.b64
          base64 -d /tmp/m16-assets.zip.b64 > /tmp/m16-assets.zip
          unzip -t /tmp/m16-assets.zip
          unzip -o /tmp/m16-assets.zip -d public
          find public/assets/store -maxdepth 1 -type f -print -exec sha256sum {} \;

      - name: Commit assembled implementation
        run: |
          rm -rf .m16 .m16asset .m16r
          rm -f .github/workflows/assemble-m16.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: rebuild store screen with real raster assets"
          git push origin HEAD:agent/milestone-16-real-raster-store
