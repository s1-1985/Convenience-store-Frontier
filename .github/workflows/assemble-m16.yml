name: Assemble Milestone 16 Assets

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/assemble-m16.yml"
      - ".m16direct/**"

permissions:
  contents: write

jobs:
  assemble-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/milestone-16-real-raster-store

      - name: Verify and expand optimized raster bundle
        run: |
          cat \
            .m16direct/chunk.00 \
            .m16direct/chunk.01 \
            .m16direct/chunk.02 \
            .m16direct/chunk.03 \
            .m16direct/chunk.04 \
            .m16direct/chunk.05 \
            .m16direct/chunk.06 \
            .m16direct/chunk.07 \
            | tr -d '\r\n\t ' \
            > /tmp/m16-assets.zip.b64
          base64 -d /tmp/m16-assets.zip.b64 > /tmp/m16-assets.zip
          printf '%s  %s\n' 'e89d5133b52a9829935711b85fccfaa9ec82fcc4865b4d8942d1e581f2c24fe8' '/tmp/m16-assets.zip' | sha256sum -c -
          unzip -t /tmp/m16-assets.zip
          mkdir -p public/assets/store
          unzip -o /tmp/m16-assets.zip -d public/assets/store
          file public/assets/store/*.webp
          sha256sum public/assets/store/*.webp

      - name: Commit real raster assets
        run: |
          rm -rf .m16 .m16asset .m16r .m16direct
          rm -f .github/workflows/assemble-m16.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add optimized real raster store atlases"
          git push origin HEAD:agent/milestone-16-real-raster-store
