name: Apply Milestone 14 Integration

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/apply-m14-integration.yml"
      - "src/game/storeLayoutEditor.ts"
      - "src/ui/storeLayoutEditorUi.ts"
      - "src/ui/storeLayoutEditor.css"
      - "src/tests/storeLayoutEditor.test.ts"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/milestone-14-store-layout-editor

      - name: Patch runtime and public exports
        run: |
          python - <<'PY'
          from pathlib import Path

          runtime_path = Path("src/ui/storeGameRuntime.ts")
          runtime = runtime_path.read_text()

          old_import = (
              '} from "../game/storeOperationsEngine.js";\n'
              'import "./storeGame.css";'
          )
          new_import = (
              '} from "../game/storeOperationsEngine.js";\n'
              'import {\n'
              '  createStoreLayoutEditorUi,\n'
              '  loadSavedStoreLayout,\n'
              '} from "./storeLayoutEditorUi.js";\n'
              'import "./storeGame.css";'
          )
          if runtime.count(old_import) != 1:
              raise SystemExit("runtime import anchor mismatch")
          runtime = runtime.replace(old_import, new_import)

          old_engine = (
              '  const saved = readSavedEngine();\n'
              '  let engine = saved ? restoreStoreOperationsEngine(saved) : createStoreOperationsEngine(seed);\n'
              '  let layout = engine.getLayout();'
          )
          new_engine = (
              '  const saved = readSavedEngine();\n'
              '  const savedLayout = loadSavedStoreLayout();\n'
              '  let engine = saved\n'
              '    ? restoreStoreOperationsEngine(saved, savedLayout)\n'
              '    : createStoreOperationsEngine(seed, savedLayout);\n'
              '  let layout = engine.getLayout();'
          )
          if runtime.count(old_engine) != 1:
              raise SystemExit("runtime engine anchor mismatch")
          runtime = runtime.replace(old_engine, new_engine)

          old_bind = (
              '  bindNavigation(shell, getEngine, replaceEngine);\n\n'
              '  engine.advance(0.01, engineContext());'
          )
          new_bind = (
              '  bindNavigation(shell, getEngine, replaceEngine);\n'
              '  createStoreLayoutEditorUi({\n'
              '    shell,\n'
              '    canvas,\n'
              '    getEngine,\n'
              '    replaceEngine,\n'
              '    canEdit: () => !isPlaying() && engine.getSnapshot().customers.length === 0,\n'
              '  });\n\n'
              '  engine.advance(0.01, engineContext());'
          )
          if runtime.count(old_bind) != 1:
              raise SystemExit("runtime binding anchor mismatch")
          runtime = runtime.replace(old_bind, new_bind)
          runtime_path.write_text(runtime)

          index_path = Path("src/index.ts")
          index_text = index_path.read_text()
          marker = (
              'export type {\n'
              '  CustomerState,\n'
              '  FixtureKind,\n'
              '  SerializedStoreOperations,\n'
              '  ShelfInventoryState,\n'
              '  StaffState,\n'
              '  StoreCategoryId,\n'
              '  StoreCustomerAgent,\n'
              '  StoreDayKpis,\n'
              '  StoreEngineContext,\n'
              '  StoreFixture,\n'
              '  StoreLayout,\n'
              '  StoreLitter,\n'
              '  StoreOperationsEngine,\n'
              '  StoreOperationsSnapshot,\n'
              '  StoreStaffAgent,\n'
              '  StoreStaffAssignments,\n'
              '  StoreStaffTask,\n'
              '  TilePoint,\n'
              '} from "./game/storeOperationsEngine.js";\n'
          )
          if index_text.count(marker) != 1:
              raise SystemExit("index export anchor mismatch")
          addition = marker + (
              '\nexport {\n'
              '  cloneStoreLayout,\n'
              '  createStoredStoreLayout,\n'
              '  editableStoreFixtureIds,\n'
              '  evaluateStoreLayout,\n'
              '  isEditableStoreFixture,\n'
              '  moveStoreFixture,\n'
              '  parseStoredStoreLayout,\n'
              '  prepareOperationsForStoreLayout,\n'
              '  rotateStoreFixtureClockwise,\n'
              '  storeFixtureAtTile,\n'
              '  storeFixtureBounds,\n'
              '} from "./game/storeLayoutEditor.js";\n'
              'export type {\n'
              '  FixtureBounds,\n'
              '  StoredStoreLayout,\n'
              '  StoreLayoutEvaluation,\n'
              '  StoreLayoutHotspot,\n'
              '  StoreLayoutIssue,\n'
              '  StoreLayoutIssueCode,\n'
              '  StoreLayoutMetrics,\n'
              '} from "./game/storeLayoutEditor.js";\n'
          )
          index_path.write_text(index_text.replace(marker, addition))
          PY
          rm -f .github/workflows/apply-m14-integration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: connect store layout editor to live operations"
          git push origin HEAD:agent/milestone-14-store-layout-editor
