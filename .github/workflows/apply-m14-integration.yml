name: Apply Milestone 14 Integration

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/apply-m14-integration.yml"
      - "src/game/storeLayoutEditor.ts"
      - "src/ui/storeLayoutEditorUi.ts"
      - "src/ui/storeLayoutEditor.css"
      - "src/tests/storeLayoutEditor.test.ts"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/milestone-14-store-layout-editor

      - name: Patch runtime and public exports
        run: |
          python - <<'PY'
          from pathlib import Path

          runtime_path = Path("src/ui/storeGameRuntime.ts")
          runtime = runtime_path.read_text()

          old_import = '''} from "../game/storeOperationsEngine.js";
          import "./storeGame.css";'''.replace("          ", "")
          new_import = '''} from "../game/storeOperationsEngine.js";
          import {
            createStoreLayoutEditorUi,
            loadSavedStoreLayout,
          } from "./storeLayoutEditorUi.js";
          import "./storeGame.css";'''.replace("          ", "")
          if runtime.count(old_import) != 1:
              raise SystemExit("runtime import anchor mismatch")
          runtime = runtime.replace(old_import, new_import)

          old_engine = '''  const saved = readSavedEngine();
          let engine = saved ? restoreStoreOperationsEngine(saved) : createStoreOperationsEngine(seed);
          let layout = engine.getLayout();'''.replace("          ", "")
          new_engine = '''  const saved = readSavedEngine();
          const savedLayout = loadSavedStoreLayout();
          let engine = saved
            ? restoreStoreOperationsEngine(saved, savedLayout)
            : createStoreOperationsEngine(seed, savedLayout);
          let layout = engine.getLayout();'''.replace("          ", "")
          if runtime.count(old_engine) != 1:
              raise SystemExit("runtime engine anchor mismatch")
          runtime = runtime.replace(old_engine, new_engine)

          old_bind = '''  bindNavigation(shell, getEngine, replaceEngine);

          engine.advance(0.01, engineContext());'''.replace("          ", "")
          new_bind = '''  bindNavigation(shell, getEngine, replaceEngine);
          createStoreLayoutEditorUi({
            shell,
            canvas,
            getEngine,
            replaceEngine,
            canEdit: () => !isPlaying() && engine.getSnapshot().customers.length === 0,
          });

          engine.advance(0.01, engineContext());'''.replace("          ", "")
          if runtime.count(old_bind) != 1:
              raise SystemExit("runtime binding anchor mismatch")
          runtime = runtime.replace(old_bind, new_bind)
          runtime_path.write_text(runtime)

          index_path = Path("src/index.ts")
          index_text = index_path.read_text()
          marker = '''export type {
            CustomerState,
            FixtureKind,
            SerializedStoreOperations,
            ShelfInventoryState,
            StaffState,
            StoreCategoryId,
            StoreCustomerAgent,
            StoreDayKpis,
            StoreEngineContext,
            StoreFixture,
            StoreLayout,
            StoreLitter,
            StoreOperationsEngine,
            StoreOperationsSnapshot,
            StoreStaffAgent,
            StoreStaffAssignments,
            StoreStaffTask,
            TilePoint,
          } from "./game/storeOperationsEngine.js";
          '''.replace("          ", "")
          if index_text.count(marker) != 1:
              raise SystemExit("index export anchor mismatch")
          addition = marker + '''
          export {
            cloneStoreLayout,
            createStoredStoreLayout,
            editableStoreFixtureIds,
            evaluateStoreLayout,
            isEditableStoreFixture,
            moveStoreFixture,
            parseStoredStoreLayout,
            prepareOperationsForStoreLayout,
            rotateStoreFixtureClockwise,
            storeFixtureAtTile,
            storeFixtureBounds,
          } from "./game/storeLayoutEditor.js";
          export type {
            FixtureBounds,
            StoredStoreLayout,
            StoreLayoutEvaluation,
            StoreLayoutHotspot,
            StoreLayoutIssue,
            StoreLayoutIssueCode,
            StoreLayoutMetrics,
          } from "./game/storeLayoutEditor.js";
          '''.replace("          ", "")
          index_text = index_text.replace(marker, addition)
          index_path.write_text(index_text)
          PY
          rm -f .github/workflows/apply-m14-integration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: connect store layout editor to live operations"
          git push origin HEAD:agent/milestone-14-store-layout-editor
