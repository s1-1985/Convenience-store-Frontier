name: Patch campaign entry once

on:
  push:
    branches:
      - agent/milestone-8-30-day-campaign
    paths:
      - .github/workflows/patch-campaign-entry-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/milestone-8-30-day-campaign
      - name: Load campaign runtime in browser UI
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text()
          marker = '    <script type="module" src="/src/ui/storeVisualizationRuntime.ts"></script>\n'
          insertion = marker + '    <script type="module" src="/src/ui/campaignRuntime.ts"></script>\n'
          if '/src/ui/campaignRuntime.ts' not in text:
              if marker not in text:
                  raise SystemExit('store visualization runtime marker not found')
              text = text.replace(marker, insertion)
              path.write_text(text)
          PY
      - name: Commit patch
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "campaign-entry-bot"
          git config user.email "campaign-entry-bot@users.noreply.github.com"
          git add index.html
          git commit -m "feat: load campaign runtime in browser UI"
          git push origin HEAD:agent/milestone-8-30-day-campaign
