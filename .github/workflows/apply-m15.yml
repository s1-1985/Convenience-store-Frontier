name: Apply Milestone 15

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/apply-m15.yml"
      - ".m15/m15bundle.tgz.b64"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/milestone-15-hidpi-art-assets

      - name: Expand and verify Milestone 15 sources
        run: |
          base64 -d .m15/m15bundle.tgz.b64 > /tmp/m15bundle.tgz
          printf '%s  %s\n' '733fc919035fc9ae3f9d3cd661dbbe542b4533edfb327e7ae0cda82b1dda15d7' '/tmp/m15bundle.tgz' | sha256sum -c -
          mkdir -p /tmp/m15 public/assets/store src/ui src/tests docs
          tar xzf /tmp/m15bundle.tgz -C /tmp/m15
          cp /tmp/m15/fixtures.svg public/assets/store/fixtures.svg
          cp /tmp/m15/staff.svg public/assets/store/staff.svg
          cp /tmp/m15/customers.svg public/assets/store/customers.svg
          cp /tmp/m15/icons.svg public/assets/store/icons.svg
          cp /tmp/m15/storeCanvasResolution.ts src/ui/storeCanvasResolution.ts
          cp /tmp/m15/storeArtAssets.ts src/ui/storeArtAssets.ts
          cp /tmp/m15/storeCanvasResolution.test.ts src/tests/storeCanvasResolution.test.ts
          cp /tmp/m15/storeArtAssets.test.ts src/tests/storeArtAssets.test.ts
          cp /tmp/m15/store-art-assets.md docs/store-art-assets.md
          python /tmp/m15/apply_m15.py

      - name: Commit integrated source
        run: |
          rm -rf .m15
          rm -f .github/workflows/apply-m15.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: integrate high-resolution store art assets"
          git push origin HEAD:agent/milestone-15-hidpi-art-assets
