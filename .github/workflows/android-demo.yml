name: Android Demo APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "data/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.ts"
      - ".github/workflows/android-demo.yml"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm install

      - name: Build web game
        run: npm run build

      - name: Create Android project
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/src/main/AndroidManifest.xml")
          text = path.read_text()
          if 'android:screenOrientation="landscape"' not in text:
              pattern = r'(<activity\b(?=[^>]*android:name="\.MainActivity")[^>]*)(>)'
              updated, count = re.subn(
                  pattern,
                  r'\1\n            android:screenOrientation="landscape"\2',
                  text,
                  count=1,
                  flags=re.DOTALL,
              )
              if count != 1:
                  raise SystemExit("Capacitor MainActivity element not found")
              text = updated
          path.write_text(text)
          PY

      - name: Build installable debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Prepare APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk convenience-store-frontier-demo.apk
          sha256sum convenience-store-frontier-demo.apk > convenience-store-frontier-demo.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: convenience-store-frontier-android-demo
          path: |
            convenience-store-frontier-demo.apk
            convenience-store-frontier-demo.apk.sha256
          if-no-files-found: error
          retention-days: 30
